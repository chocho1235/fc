name: Refresh football model

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r football_ai_model/requirements.txt

      - name: Refresh fixtures, FPL context and predictions
        run: python football_ai_model/src/refresh_upcoming.py

      - name: Commit refreshed data
        run: |
          git config user.name "football-model-bot"
          git config user.email "football-model-bot@users.noreply.github.com"
          git add football_ai_model/data/external/match_context.csv
          git add football_ai_model/data/raw/fixtures.csv
          git add football_ai_model/data/processed/upcoming_predictions.csv
          git add public/football-model-data.json
          git diff --cached --quiet || git commit -m "Refresh football model data"
          git push
