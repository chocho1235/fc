name: Refresh football model

on:
  schedule:
    # Refresh results, fixtures, odds and predictions every 6 hours
    - cron: "17 */6 * * *"
    # Full retrain every Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Force full model retrain"
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time. Runs queue rather than cancel each other, so a refresh
# never kills the weekly retrain halfway through.
concurrency:
  group: football-model-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Weekly full retrain ──────────────────────────────────────────────────────
  retrain:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.retrain == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football_ai_model/requirements.txt

      - name: Install Python dependencies
        run: pip install -r football_ai_model/requirements.txt

      - name: Download results for every league and season
        run: python football_ai_model/src/download_data.py

      - name: Collect starting line-ups (back-fills past seasons on first run)
        run: python football_ai_model/src/lineups.py --backfill
        continue-on-error: true   # ESPN being down must not block the retrain

      - name: Refresh xG data from understat.com
        run: python football_ai_model/src/import_understat_xg.py
        continue-on-error: true   # don't fail if understat is down

      - name: Full retrain and walk-forward backtest
        run: python football_ai_model/src/train_sklearn_1x2_model.py

      - name: Train and test the line-up layer
        run: python football_ai_model/src/train_lineup_layer.py
        continue-on-error: true

      - name: Refresh fixtures, odds and predictions
        run: python football_ai_model/src/refresh_upcoming_sklearn.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit model + data
        run: |
          git config user.name "football-model-bot"
          git config user.email "football-model-bot@users.noreply.github.com"
          git add football_ai_model/data football_ai_model/models football_ai_model/reports public/football-model-data.json
          git diff --cached --quiet || git commit -m "Weekly retrain $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  # ── 6-hourly refresh (results, fixtures, odds, predictions, bet tracking) ────
  refresh:
    if: (github.event_name == 'schedule' && github.event.schedule != '0 3 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.retrain != true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football_ai_model/requirements.txt

      - name: Install Python dependencies
        run: pip install -r football_ai_model/requirements.txt

      - name: Collect recent starting line-ups
        run: python football_ai_model/src/lineups.py
        continue-on-error: true

      - name: Refresh results, fixtures, odds and predictions
        run: python football_ai_model/src/refresh_upcoming_sklearn.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit refreshed data
        run: |
          git config user.name "football-model-bot"
          git config user.email "football-model-bot@users.noreply.github.com"
          git add football_ai_model/data football_ai_model/models football_ai_model/reports public/football-model-data.json
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
